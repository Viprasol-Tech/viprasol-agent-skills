name: validate
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate hub consistency
        run: python scripts/validate_hub.py
      - name: Shellcheck install.sh syntax
        run: bash -n install.sh
